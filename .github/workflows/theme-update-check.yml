# Weekly check for new Minimal Mistakes releases.
#
# The theme is used as a remote_theme pinned in _config.yml. When upstream
# publishes a newer release, this opens an issue with the CHANGELOG and the
# upstream changes to the files this site mirrors from the theme, so they can
# be reviewed before bumping the pinned version.
name: Theme update check

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  UPSTREAM: mmistakes/minimal-mistakes
  # Files copied from the theme that need manual syncing on upgrade
  MIRRORED_FILES: _config.yml _data/ui-text.yml assets/css/main.scss

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare pinned and latest versions
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pinned=$(sed -n 's/^remote_theme *: *"[^@"]*@\([^"]*\)".*/\1/p' _config.yml)
          latest=$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name 2>/dev/null || true)
          if [ -z "$latest" ]; then
            # Fall back to the highest x.y.z tag
            latest=$(git ls-remote --tags --refs "https://github.com/$UPSTREAM.git" \
              | sed 's|.*refs/tags/||' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          fi
          echo "pinned=$pinned latest=$latest"
          if [ -z "$pinned" ] || [ -z "$latest" ]; then
            echo "::error::Could not determine pinned ($pinned) or latest ($latest) version"
            exit 1
          fi
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [ "$pinned" = "$latest" ]; then
            echo "Theme is up to date."
            echo "update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          title="Minimal Mistakes $latest available (pinned: $pinned)"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          existing=$(gh issue list --state open --label theme-update --json title --jq ".[] | select(.title == \"$title\") | .title")
          if [ -n "$existing" ]; then
            echo "Issue already open: $title"
            echo "update=false" >> "$GITHUB_OUTPUT"
          else
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build issue body
        if: steps.versions.outputs.update == 'true'
        env:
          PINNED: ${{ steps.versions.outputs.pinned }}
          LATEST: ${{ steps.versions.outputs.latest }}
        run: |
          git clone --quiet --filter=blob:none "https://github.com/$UPSTREAM.git" upstream
          {
            echo "Upstream [$UPSTREAM](https://github.com/$UPSTREAM) released **$LATEST**; this site pins **$PINNED** in \`_config.yml\`."
            echo
            echo "Compare: https://github.com/$UPSTREAM/compare/$PINNED...$LATEST"
            echo
            echo "## To upgrade"
            echo "1. Change \`remote_theme\` in \`_config.yml\` to \`mmistakes/minimal-mistakes@$LATEST\`."
            echo "2. Apply the relevant upstream changes to the mirrored files below (new config options, ui-text keys)."
            echo "3. Check that post URLs are unchanged (sitemap) after the Pages build."
            echo
            echo "## CHANGELOG ($PINNED → $LATEST)"
            echo
            # Release notes between the two versions, taken from the newer CHANGELOG
            git -C upstream show "$LATEST:CHANGELOG.md" \
              | awk -v stop="## [$PINNED]" 'index($0, stop) == 1 { exit } /^## \[/ { p = 1 } p'
            echo
            echo "## Upstream changes to mirrored files"
            for f in $MIRRORED_FILES; do
              d=$(git -C upstream diff "$PINNED" "$LATEST" -- "$f")
              echo
              echo "### \`$f\`"
              if [ -z "$d" ]; then
                echo "No changes."
              else
                echo '```diff'
                echo "$d"
                echo '```'
              fi
            done
          } > body.md
          # GitHub issue bodies are limited to 65536 characters
          if [ "$(wc -c < body.md)" -gt 60000 ]; then
            head -c 60000 body.md > body.tmp
            printf '\n\n_(truncated; see the compare link above)_\n' >> body.tmp
            mv body.tmp body.md
          fi

      - name: Open issue
        if: steps.versions.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.versions.outputs.title }}
        run: |
          gh label create theme-update --color 0e8a16 --description "Upstream theme release" 2>/dev/null || true
          gh issue create --title "$TITLE" --label theme-update --body-file body.md
