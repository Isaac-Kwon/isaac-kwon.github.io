# Theme Settings
# https://mmistakes.github.io/minimal-mistakes/docs/configuration/
# To update the theme, bump the version below and check the upstream CHANGELOG.
remote_theme             : "mmistakes/minimal-mistakes@4.28.1"
minimal_mistakes_skin    : "default" # "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise"

# Site Settings
locale                   : "en-US"
title                    : "Minjae Isaac Kwon"
title_separator          : "-"
subtitle                 : # site tagline that appears below site title in masthead
name                     : "Minjae Isaac Kwon"
description              : "Personal Website"
url                      : "https://isaack.dev"
baseurl                  : ""
repository               : # GitHub username/repo-name e.g. "mmistakes/minimal-mistakes"
teaser                   : # path of fallback teaser image, e.g. "/assets/images/500x300.png"
logo                     : # path of logo image to display in the masthead, e.g. "/assets/images/88x88.png"
masthead_title           : # overrides the website title displayed in the masthead, use " " for no title
# breadcrumbs            : false # true, false (default)
words_per_minute         : 200
comments                 : false
atom_feed:
  path                   : # blank (default) uses feed.xml
  hide                   : # true, false (default)
search                   : true #, false (default)
search_full_content      : true #, false (default)
search_provider          : # lunr (default), algolia, google
# SEO Related
google_site_verification :
bing_site_verification   :
naver_site_verification  :
yandex_site_verification :
baidu_site_verification  :

# Analytics
analytics:
  provider               : "google-gtag" # false (default), "google", "google-universal", "google-gtag", "custom"
  google:
    tracking_id          : "G-894XVHGPT3"
    anonymize_ip         : # true, false (default)

# Site Author
author:
  name             : "Minjae Isaac Kwon"
  avatar           : "/assets/img/profile_sq.jpg"
  bio              : "Physicist, Engineer, Mechanics"
  location         : "Turin, Italy"
  email            : #"minjae.issac.kwon@gmail.com"
  links:
    - label: "Email (Work)"
      icon: "far fa-fw fa-envelope"
      url:  mailto:isaac@uos.ac.kr
    - label: "Email (Personal)"
      icon: "fas fa-fw fa-envelope"
      url:  mailto:minjae.isaac.kwon@gmail.com
    - label: "Website"
      icon: "fas fa-fw fa-link"
      url:  "https://isaack.dev"
    - label: "Facebook"
      icon: "fab fa-fw fa-facebook-square"
      url: "https://facebook.com/Minjae.Isaac.Kwon"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Isaac-Kwon"

# Site Footer
footer:
  links:
    - label: "Facebook"
      icon: "fab fa-fw fa-facebook-square"
      url: "https://facebook.com/Minjae.Isaac.Kwon"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Isaac-Kwon"

# Reading Files
include:
  - .htaccess
  - _pages
exclude:
  - vendor
  - .bundle
  - .jekyll-cache
  - .sass-cache
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # https://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style

# Outputting
permalink: /:categories/:title/
# paginate: 5 # amount of posts to show
# paginate_path: /page:num/
timezone: Asia/Seoul # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-remote-theme

# mimic GitHub Pages with --safe
whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-remote-theme

# Archives
#  Type
#  - GitHub Pages compatible archive pages built with Liquid ~> type: liquid (default)
#  Path (examples)
#  - Archive page should exist at path when using Liquid method or you can
#    expect broken links (especially with breadcrumbs enabled)
#  - <base_path>/tags/my-awesome-tag/index.html ~> path: /tags/
#  - <base_path>/categories/my-awesome-category/index.html ~> path: /categories/
#  - <base_path>/my-awesome-category/index.html ~> path: /
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
# HTML Compression
# - https://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development

# Defaults
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: false
      share: true
      related: true
      sitemap: true
  # archives
  - scope:
      path: ""
      type: archives
    values:
      layout: single
      author_profile: true
      read_time: false
      share: true
      related: true
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      sitemap: true
  - scope:
      path: "assets/*"
    values: 
      sitemap: false

# MathJax 3: renders kramdown math ($$...$$ is emitted as \(...\) / \[...\])
head_scripts:
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
